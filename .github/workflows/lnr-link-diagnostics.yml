name: LNR shortcut portability diagnostics
on:
  push:
    branches: ["lnr/windows-chd-build"]
    paths: [".github/workflows/lnr-link-diagnostics.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Evaluate portable Windows Shell Link formats without shipping changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $d = Join-Path $env:RUNNER_TEMP ('lnr-link-source-' + [guid]::NewGuid().ToString('N'))
          $c = Join-Path $env:LOCALAPPDATA ('lnr-link-extract-' + [guid]::NewGuid().ToString('N'))
          if ([IO.Path]::GetPathRoot($d) -eq [IO.Path]::GetPathRoot($c)) { throw 'Need different drives for reliable diagnosis' }
          New-Item -ItemType Directory -Path $d,$c -Force | Out-Null
          Copy-Item "$env:WINDIR/System32/notepad.exe" (Join-Path $d 'PSXPackagerGUI.exe')
          Copy-Item "$env:WINDIR/System32/notepad.exe" (Join-Path $c 'PSXPackagerGUI.exe')
          $icon = '%SystemRoot%\System32\shell32.dll'
          function Create-RawLink([string]$dest,[string]$kind,[string]$envValue) {
            $stream = [IO.File]::Create($dest)
            try {
              $bw = [IO.BinaryWriter]::new($stream,[Text.Encoding]::Unicode,$true)
              try {
                $flags = [uint32]0x1EC
                if ($kind -eq 'env') { $flags = $flags -bor [uint32]0x200 -bor [uint32]0x02000000 }
                if ($kind -eq 'linkinfo') { $flags = [uint32]0xEE }
                $bw.Write([uint32]0x4c)
                $bw.Write(([Guid]'00021401-0000-0000-C000-000000000046').ToByteArray())
                $bw.Write([uint32]$flags)
                $bw.Write([uint32]0x20)
                foreach($i in 1..3){$bw.Write([int64]0)}
                $bw.Write([uint32]0)
                $bw.Write([int32]179)
                $bw.Write([uint32]1)
                $bw.Write([uint16]0)
                $bw.Write([uint16]0)
                $bw.Write([uint32]0)
                $bw.Write([uint32]0)
                if($kind -eq 'linkinfo'){
                  $local = [Text.Encoding]::ASCII.GetBytes(".\PSXPackagerGUI.exe`0")
                  $suffix = [Text.Encoding]::ASCII.GetBytes("PSXPackagerGUI.exe`0")
                  $volume=[IO.MemoryStream]::new()
                  $vw=[IO.BinaryWriter]::new($volume)
                  $vw.Write([uint32]17);$vw.Write([uint32]3);$vw.Write([uint32]0);$vw.Write([uint32]16);$vw.Write([byte]0);$vw.Flush()
                  $vol=$volume.ToArray();$vw.Dispose();$volume.Dispose()
                  $offset = 28 + $vol.Length
                  $bw.Write([uint32](28+$vol.Length+$local.Length+$suffix.Length))
                  $bw.Write([uint32]28)
                  $bw.Write([uint32]1)
                  $bw.Write([uint32]28)
                  $bw.Write([uint32]$offset)
                  $bw.Write([uint32]0)
                  $bw.Write([uint32]($offset+$local.Length))
                  $bw.Write([byte[]]$vol)
                  $bw.Write([byte[]]$local)
                  $bw.Write([byte[]]$suffix)
                }
                foreach($value in @('PSXPackagerLNR','.\PSXPackagerGUI.exe','--lnr-batch',$icon)){
                  $bw.Write([uint16]$value.Length)
                  $bw.Write([Text.Encoding]::Unicode.GetBytes($value))
                }
                if($kind -eq 'env'){
                  $ansi=[Text.Encoding]::ASCII.GetBytes($envValue)
                  $unicode=[Text.Encoding]::Unicode.GetBytes($envValue)
                  if($ansi.Length -ge 260 -or $unicode.Length -ge 520){throw 'Env path too large'}
                  $bw.Write([uint32]0x314)
                  $bw.Write([uint32]2684354561)
                  $bw.Write([byte[]]$ansi)
                  $bw.Write((New-Object byte[] (260-$ansi.Length)))
                  $bw.Write([byte[]]$unicode)
                  $bw.Write((New-Object byte[] (520-$unicode.Length)))
                }
                $bw.Write([uint32]0)
                $bw.Flush()
              } finally { $bw.Dispose() }
            } finally { $stream.Dispose() }
          }
          $variants = [ordered]@{
            'relative-strings-only' = @('raw','')
            'relative-linkinfo' = @('linkinfo','')
            'environment-relative-dot' = @('env','.\PSXPackagerGUI.exe')
            'environment-relative-filename' = @('env','PSXPackagerGUI.exe')
            'environment-current-directory' = @('env','%CD%\PSXPackagerGUI.exe')
          }
          foreach($entry in $variants.GetEnumerator()) {
            Create-RawLink (Join-Path $d ($entry.Key+'.lnk')) $entry.Value[0] $entry.Value[1]
          }
          $sh=New-Object -ComObject WScript.Shell
          foreach($kind in @('native-rel-name','native-rel-dot','native-absolute')) {
            $lnkPath=Join-Path $d ($kind+'.lnk')
            $link=$sh.CreateShortcut($lnkPath)
            $link.TargetPath=if($kind -eq 'native-rel-name'){'PSXPackagerGUI.exe'}elseif($kind -eq 'native-rel-dot'){'.\PSXPackagerGUI.exe'}else{Join-Path $d 'PSXPackagerGUI.exe'}
            $link.Arguments='--lnr-batch'
            $link.IconLocation="$env:WINDIR\System32\shell32.dll,179"
            $link.Save()
          }
          Rename-Item (Join-Path $d 'PSXPackagerGUI.exe') 'PSXPackagerGUI.exe.hidden'
          foreach($file in (Get-ChildItem $d -Filter '*.lnk')) {
            $name=$file.BaseName
            $dest=Join-Path $c $file.Name
            Copy-Item $file.FullName $dest
            $bytes=[IO.File]::ReadAllBytes($dest)
            $raw16=[Text.Encoding]::Unicode.GetString($bytes)
            $raw8=[Text.Encoding]::ASCII.GetString($bytes)
            $absolute=($raw16.Contains($d) -or $raw8.Contains($d))
            Write-Host "DIAGNOSTIC $name has-original-absolute=$absolute size=$($bytes.Length)"
            try {
              $shortcut=$sh.CreateShortcut($dest)
              Write-Host "  WScript target=$($shortcut.TargetPath) args=$($shortcut.Arguments)"
              if($absolute){ Write-Host '  REJECT: contains build directory'; continue }
              $start=[Diagnostics.ProcessStartInfo]::new($dest)
              $start.UseShellExecute=$true
              $p=[Diagnostics.Process]::Start($start)
              if($null -eq $p) { Write-Host '  FAIL: no process'; continue }
              try {
                Start-Sleep -Milliseconds 250
                $path=$p.MainModule.FileName
                if(-not [string]::Equals($path,(Join-Path $c 'PSXPackagerGUI.exe'),[StringComparison]::OrdinalIgnoreCase)) {
                  Write-Host "  FAIL: unexpected exe $path"
                } else {
                  Write-Host "  PASS: double-click executed $path"
                }
              } finally {
                if(-not $p.HasExited) {$p.Kill($true);[void]$p.WaitForExit(3000)}
                $p.Dispose()
              }
            } catch {
              Write-Host "  FAIL: $($_.Exception.Message)"
            }
          }
          Write-Host 'Candidate diagnostics finished'
