name: Embed real batch-processing screenshot in beta.29 public release

on:
  push:
    branches:
      - lnr/windows-chd-build
    paths:
      - ".github/workflows/lnr-update-public-notes-beta29.yml"

permissions:
  contents: write

concurrency:
  group: lnr-beta29-notes-edit
  cancel-in-progress: false

jobs:
  update-release:
    if: github.repository == 'PaPer-DJ/PSXPackagerLNR'
    runs-on: ubuntu-latest
    steps:
      - name: Verify uploaded screenshot and update existing release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo='PaPer-DJ/PSXPackagerLNR'
          tag='v0.1.0-beta.29'
          rid=448060186
          pinned='69dce2b57330ff3cdb2b1bec78d337500026796d'
          screenshot_commit='5f54df1cf08f04a4ea7190827cf063ef351d816f'
          screenshot_path='docs/images/psxpackagerlnr-beta29-procesamiento-por-lotes.png'
          endpoint="repos/$repo/releases/$rid"

          before="$(gh api "$endpoint")"
          test "$(jq -r '.draft' <<< "$before")" = 'false'
          test "$(jq -r '.prerelease' <<< "$before")" = 'true'
          test "$(jq -r '.tag_name' <<< "$before")" = "$tag"
          test "$(jq -r '.target_commitish' <<< "$before")" = "$pinned"
          test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')" = "$pinned"
          test "$(jq '.assets | length' <<< "$before")" = '4'

          expected_blob='347fbcec08af46502001c2830e06d63a795acebf'
          actual_blob="$(gh api "repos/$repo/contents/$screenshot_path?ref=$screenshot_commit" --jq '.sha')"
          test "$actual_blob" = "$expected_blob"
          expected_assets="$(jq -c '[.assets[] | {id, name, size}] | sort_by(.id)' <<< "$before")"

          jq -r '.body' <<< "$before" > /tmp/release-notes.md
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/release-notes.md')
          body=p.read_text(encoding='utf-8')
          url='https://raw.githubusercontent.com/PaPer-DJ/PSXPackagerLNR/5f54df1cf08f04a4ea7190827cf063ef351d816f/docs/images/psxpackagerlnr-beta29-procesamiento-por-lotes.png'
          marker='## Funciones y mejoras de esta edición'
          screenshot_section=(
              '## Captura real: PSXPackagerLNR convirtiendo por lotes\n\n'
              '![PSXPackagerLNR beta.29 en Windows: conversión directa CHD a PBP, estados individuales, registro y avance del lote]('+url+')\n\n'
              '*Captura original de LaNaveRETRO durante una ejecución real de la **beta.29 build 465**: '
              '**272 PBP previstos, 95 terminados (35 %) en el instante de la imagen**, '
              'con un juego procesándose y su progreso individual visible. '
              'La descarga pública de esta versión corresponde a la **build 466**.*\n\n'
          )
          if url not in body:
              assert body.count(marker)==1, 'No unique insertion point in release notes'
              body=body.replace(marker,screenshot_section+marker)
          assert body.count(url)==1, 'Screenshot link missing or duplicated'
          p.write_text(body,encoding='utf-8')
          PY

          gh release edit "$tag" --repo "$repo" --notes-file /tmp/release-notes.md

          after="$(gh api "$endpoint")"
          actual_assets="$(jq -c '[.assets[] | {id, name, size}] | sort_by(.id)' <<< "$after")"
          test "$expected_assets" = "$actual_assets"
          test "$(jq -r '.draft' <<< "$after")" = 'false'
          test "$(jq -r '.prerelease' <<< "$after")" = 'true'
          test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')" = "$pinned"
          jq -r '.body' <<< "$after" | grep -Fq "$screenshot_commit/$screenshot_path"
          echo "Screenshot embedded. Original release binaries and Git tag unchanged."
          jq -r '.html_url' <<< "$after"
