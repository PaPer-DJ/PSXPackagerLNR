name: Publish PSXPackagerLNR v1.0.0 stable build 786

on:
  push:
    branches:
      - lnr/windows-chd-build
    paths:
      - ".github/workflows/lnr-publish-v1.0.0.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: lnr-release-v1-0-0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'PaPer-DJ/PSXPackagerLNR'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tested v1.0.0 source
        uses: actions/checkout@v4
        with:
          ref: ad66bc59f1da99535feb68431a244f055be96ba1
          persist-credentials: false

      - name: Verify stable v1.0.0 build and publish protected release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='PaPer-DJ/PSXPackagerLNR'
          tag='v1.0.0'
          pinned='ad66bc59f1da99535feb68431a244f055be96ba1'
          run=44392189261
          build=786
          artifact='PSXPackagerLNR-v1.0.0-b786-Windows-x64'
          prefix='PSXPackagerLNR-v1.0.0-b786'
          oldmaster='453c0e7b11fa46d78fa1939473923699894fde03'
          oldtag31='328ea04e79011191ab434759c52ca42c32cb0bf9'
          oldtag30='d738ef6fb05f1318bcc14dc08425eab6518f35cc'
          oldtag29='69dce2b57330ff3cdb2b1bec78d337500026796d'

          # Never publish a different source or change previous releases.
          test "$(git rev-parse HEAD)" = "$pinned"
          test "$(tr -d '\r\n' < LNR/VERSION)" = '1.0.0'
          grep -Fq 'v1.0.0' README.md
          grep -Fq '## v1.0.0' CHANGELOG-LNR.md
          grep -Fq 'Dreamcast GDI → CHD' LNR/RELEASE-NOTES-v1.0.0.md
          grep -Fq 'RupertAvery' LNR/RELEASE-NOTES-v1.0.0.md
          test -s LICENSE
          test "$(gh api "repos/$repo/branches/master" --jq '.commit.sha')" = "$oldmaster"
          test "$(gh api "repos/$repo/git/ref/tags/v0.1.0-beta.30" --jq '.object.sha')" = "$oldtag30"
          test "$(gh api "repos/$repo/git/ref/tags/v0.1.0-beta.29" --jq '.object.sha')" = "$oldtag29"
          for old in v0.1.0-beta.31 v0.1.0-beta.30 v0.1.0-beta.29; do
            previous="$(gh api "repos/$repo/releases/tags/$old")"
            test "$(jq -r '.draft' <<< "$previous")" = 'false'
            test "$(jq -r '.prerelease' <<< "$previous")" = 'true'
            test "$(jq '.assets | length' <<< "$previous")" = '4'
          done

          ci="$(gh api "repos/$repo/actions/runs/$run")"
          test "$(jq -r '.head_sha' <<< "$ci")" = "$pinned"
          test "$(jq -r '.status' <<< "$ci")" = 'completed'
          test "$(jq -r '.conclusion' <<< "$ci")" = 'success'
          test "$(jq -r '.run_number' <<< "$ci")" = "$build"
          artifact_data="$(gh api "repos/$repo/actions/runs/$run/artifacts")"
          test "$(jq --arg name "$artifact" '[.artifacts[] | select(.name==$name and .expired==false)] | length' <<< "$artifact_data")" = '1'

          mkdir -p dist
          gh run download "$run" --repo "$repo" --name "$artifact" --dir dist
          for edition in GUI CLI Toolkit; do
            filename="dist/$prefix-$edition-win-x64.zip"
            test -s "$filename" || { echo "Missing ZIP $filename" >&2; exit 1; }
            unzip -t "$filename" >/dev/null
          done
          gui="dist/$prefix-GUI-win-x64.zip"
          cli="dist/$prefix-CLI-win-x64.zip"
          toolkit="dist/$prefix-Toolkit-win-x64.zip"
          unzip -Z1 "$gui" | grep -Fxq '#PSXPackagerLNR.lnk'
          unzip -Z1 "$gui" | grep -Fxq 'PSXPackagerGUI.exe'
          unzip -Z1 "$gui" | grep -Fxq 'psxpackager.exe'
          unzip -Z1 "$cli" | grep -Fxq 'psxpackager.exe'
          unzip -Z1 "$cli" | grep -Fxq 'LEEME-CLI-LNR.txt'
          unzip -Z1 "$gui" | grep -Fxq 'LEEME-CLI-LNR.txt'
          unzip -Z1 "$toolkit" | grep -Fxq 'LNR_CHD_A_PBP.bat'
          unzip -Z1 "$toolkit" | grep -Fxq '.tools/LNR_CHD_A_PBP/LNR_CHD_A_PBP.ps1'
          unzip -Z1 "$toolkit" | grep -Fxq '.tools/LNR_CHD_A_PBP/LEEME-CLI-LNR.txt'
          unzip -p "$toolkit" LNR_CHD_A_PBP.bat | grep -Fq '1 - SEPARADOS: un PBP por CHD, nombre original conservado. [RECOMENDADO]'
          test "$(unzip -p "$gui" LNR-VERSION.txt | tr -d '\r\n')" = 'v1.0.0 (b786)'
          test "$(unzip -p "$cli" LNR-VERSION.txt | tr -d '\r\n')" = 'v1.0.0 (b786)'
          (
            cd dist
            sha256sum "$prefix"-*.zip > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          echo 'Verified all three original stable build 786 ZIPs and SHA256SUMS.txt'

          # Never rewrite a pre-existing tag.
          if gh api "repos/$repo/git/ref/tags/$tag" > /tmp/v1.0.0-tag.json 2>/dev/null; then
            test "$(jq -r '.object.sha' < /tmp/v1.0.0-tag.json)" = "$pinned"
          else
            gh api -X POST "repos/$repo/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$pinned" >/dev/null
          fi
          test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')" = "$pinned"

          # Draft releases are intentionally absent from the by-tag endpoint.
          # Enumerate releases to find the draft on first run/retry.
          all_releases="$(gh api "repos/$repo/releases?per_page=50")"
          existing_count="$(jq --arg t "$tag" '[.[] | select(.tag_name==$t)] | length' <<< "$all_releases")"
          test "$existing_count" = '0' || test "$existing_count" = '1'
          if [ "$existing_count" = '0' ]; then
            gh release create "$tag" "$gui" "$cli" "$toolkit" dist/SHA256SUMS.txt \
              --repo "$repo" --title 'PSXPackagerLNR v1.0.0 — Primera versión estable LaNaveRETRO' \
              --notes-file LNR/RELEASE-NOTES-v1.0.0.md \
              --target "$pinned" --verify-tag --draft
          fi

          all_releases="$(gh api "repos/$repo/releases?per_page=50")"
          rid="$(jq -r --arg t "$tag" '.[] | select(.tag_name==$t) | .id' <<< "$all_releases")"
          test -n "$rid" && test "$rid" != 'null'
          endpoint="repos/$repo/releases/$rid"
          staged="$(gh api "$endpoint")"
          test "$(jq -r '.tag_name' <<< "$staged")" = "$tag"
          test "$(jq -r '.target_commitish' <<< "$staged")" = "$pinned"
          test "$(jq -r '.prerelease' <<< "$staged")" = 'false'
          test "$(jq '.assets | length' <<< "$staged")" = '4'
          for name in \
            "$prefix-CLI-win-x64.zip" \
            "$prefix-GUI-win-x64.zip" \
            "$prefix-Toolkit-win-x64.zip" \
            SHA256SUMS.txt
          do
            test "$(jq --arg n "$name" '[.assets[] | select(.name==$n and .size>0)] | length' <<< "$staged")" = '1'
          done
          jq -r '.body' <<< "$staged" | grep -Fq 'Dreamcast'
          jq -r '.body' <<< "$staged" | grep -Fq 'RupertAvery'

          original_assets="$(jq -c '[.assets[] | {id,name,size}] | sort_by(.id)' <<< "$staged")"
          if [ "$(jq -r '.draft' <<< "$staged")" = 'true' ]; then
            gh api -X PATCH "$endpoint" -F draft=false -F prerelease=false -f make_latest=true >/dev/null
          fi
          final="$(gh api "repos/$repo/releases/tags/$tag")"
          test "$(jq -r '.id' <<< "$final")" = "$rid"
          test "$(jq -r '.draft' <<< "$final")" = 'false'
          test "$(jq -r '.prerelease' <<< "$final")" = 'false'
          test "$(jq -r '.target_commitish' <<< "$final")" = "$pinned"
          test "$(jq -c '[.assets[] | {id,name,size}] | sort_by(.id)' <<< "$final")" = "$original_assets"
          test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')" = "$pinned"
          test "$(gh api "repos/$repo/git/ref/tags/v0.1.0-beta.30" --jq '.object.sha')" = "$oldtag30"
          test "$(gh api "repos/$repo/git/ref/tags/v0.1.0-beta.29" --jq '.object.sha')" = "$oldtag29"
          test "$(gh api "repos/$repo/branches/master" --jq '.commit.sha')" = "$oldmaster"

          test "$(gh api "repos/$repo/releases/latest" --jq '.tag_name')" = "$tag"
          test "$(gh api "repos/$repo/git/ref/tags/v0.1.0-beta.31" --jq '.object.sha')" = "$oldtag31"
          url="$(jq -r '.html_url' <<< "$final")"
          echo "STABLE v1.0.0 PUBLIC RELEASE VERIFIED: $url"
          echo '### PSXPackagerLNR v1.0.0 stable public release' >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned commit: $pinned · Build 786 · GUI / CLI / Toolkit / SHA256" >> "$GITHUB_STEP_SUMMARY"
